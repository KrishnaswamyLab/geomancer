[project]
name = "geomancer"
version = "0.1.0"
description = "The Krishnaswamy Lab's public configuration layer, built on manyruns by Latent Reasoning Works."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [{name = "Krishnaswamy Lab"}]
dependencies = ["manyruns", "torch; sys_platform == 'linux'"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/KrishnaswamyLab/geomancer"
Upstream = "https://github.com/latent-reasoning-works/manyruns"

[project.scripts]
geomancer = "geomancer.app:main"

[project.optional-dependencies]
# The scShapeBench learner (geomancer/learner). The evaluator is pinned by commit;
# scshapebench is not on PyPI. dreeb (KL's scReebTower) is private, so it is not
# listed: its actions register only when sc_reeb_tower imports.
learner = ["scshapebench", "manylatents-omics[singlecell]", "kmapper>=2.1", "scanpy>=1.11", "phate>=1.0", "scikit-learn>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "PyYAML>=6"]

[tool.uv.sources]
manyruns = { git = "https://github.com/latent-reasoning-works/manyruns", tag = "v0.1.0" }
scshapebench = { git = "https://github.com/KrishnaswamyLab/scShapeBench", rev = "d81963f1f950d86c16ee5171987994898029239c" }
# The scShapeBench loader (manylatents.singlecell.data.scshapebench) is on the
# feat/scshapebench-data branch, latent-reasoning-works/manylatents-omics#74.
manylatents-omics = { git = "https://github.com/latent-reasoning-works/manylatents-omics", rev = "61c6a63717d597ef92c7e27c557b297e92d956f1" }
# Make the transitive torch dependency CPU-only on Linux in the lock itself.
# macOS continues to use PyPI's CPU wheels.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Copied from manyruns v0.1.0's hatch include, with the package name changed.
[tool.hatch.build.targets.sdist]
include = [
    "/geomancer/", "/tests/", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
include = ["/geomancer/"]
packages = ["geomancer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "source_checkout: requires repository files or the Git index, omitted from sdist",
    "network: requires a generated uv.lock and network access",
]
